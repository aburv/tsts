@if (user()) {
  <app-image 
    [size]="45" 
    [id]="user()!.dp" 
    [icon]="Icon.PERSON" 
    (click)="isDialogOn = true"
    (keydown.enter)="isDialogOn = true"
    (keydown.space)="isDialogOn = true"
    tabindex="0"
    role="button"
    style="cursor: pointer;"
    [attr.aria-label]="'Open profile dialog for ' + user()!.name"
    alt="{{ user()!.name }}-display-picture">
  </app-image>
}
@else {
  <div id="google-signin-button"></div>
} 

<ng-template #dialogContent>
  @if (user()) {
    <div class="image-holder" aria-label="Close profile dialog">
      <div class="profile-card">
        <div class="profile-kicker">User PROFILE</div>
        <div class="avatar-frame">
          <app-image 
            [size]="150" 
            [id]="user()!.dp" 
            [icon]="Icon.PERSON" 
            [alt]="user()!.name + '-display-picture'">
          </app-image>
        </div>
        <div class="profile-name">{{ user()!.name }}</div>
        <div class="profile-email">{{ user()!.email }}</div>
      </div>
    </div>
  }
</ng-template>

@if (user() && isDialogOn) {
  <app-dialog [content]="dialogContent" (closeEmitter)="onDialogClose()"></app-dialog>
}
